name: Linsen packages
on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
permissions:
  contents: read
jobs:
  android:
    strategy:
      fail-fast: false
      matrix:
        arch: [arm, arm64]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.5'
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Rust and NDK
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
          sdkmanager 'ndk;28.2.13676358' 'platforms;android-37' 'build-tools;37.0.0'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - run: python3 tooling/build_native.py android ${{ matrix.arch }}
      - name: Configure the persistent release signature
        env:
          KEYSTORE: ${{ secrets.LINSEN_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.LINSEN_KEYSTORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE"
          printf '%s' "$KEYSTORE" | base64 --decode > android/app/linsen-release.jks
          python3 - <<'PY'
          import os, pathlib
          password = os.environ['PASSWORD']
          pathlib.Path('android/key.properties').write_text('storeFile=linsen-release.jks\nkeyAlias=linsen\nstorePassword='+password+'\nkeyPassword='+password+'\n')
          PY
      - name: Build signed APK
        run: flutter build apk --release --target-platform android-${{ matrix.arch }}
      - name: Collect APK and checksum
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/Linsen-android-${{ matrix.arch }}.apk
          cd dist
          sha256sum *.apk > SHA256SUMS-android-${{ matrix.arch }}.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Linsen-android-${{ matrix.arch }}
          path: dist/*
          retention-days: 30
  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2022
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.5'
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Build native backend
        shell: pwsh
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
          python tooling/build_native.py windows ${{ matrix.arch }}
      - run: python tooling/build_lofty.py ${{ matrix.arch }}
      - run: python tooling/prepare_mpv.py ${{ matrix.arch }}
      - run: flutter build windows --release --target-platform windows-${{ matrix.arch }}
      - name: Verify binaries and build installer
        shell: pwsh
        run: |
          python tooling/verify_pe.py build/windows/${{ matrix.arch }}/runner/Release ${{ matrix.arch }}
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DArch=${{ matrix.arch }} tooling/windows-installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $file = Get-ChildItem dist/*.exe
          "$( (Get-FileHash $file -Algorithm SHA256).Hash.ToLower())  $($file.Name)" | Out-File -Encoding ascii dist/SHA256SUMS-windows-${{ matrix.arch }}.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Linsen-windows-${{ matrix.arch }}
          path: dist/*
          retention-days: 30
